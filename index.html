<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Download the Data format PowerPoint presentation." />
    <meta name="theme-color" content="#442142" />
    <title>Data format</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1920;
        --muted: #706a73;
        --line: #ddd8df;
        --paper: #ffffff;
        --ground: #f5f3f5;
        --purple: #442142;
        --gold: #b4a87d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .accent {
        height: 6px;
        background: linear-gradient(90deg, var(--purple) 0 76%, var(--gold) 76% 100%);
      }

      main {
        display: grid;
        min-height: calc(100vh - 6px);
        place-items: center;
        padding: 32px 20px;
      }

      .panel {
        width: min(680px, 100%);
        padding: clamp(30px, 7vw, 58px);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
        box-shadow: 0 24px 60px rgba(50, 31, 48, 0.09);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--purple);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(42px, 10vw, 72px);
        line-height: 0.96;
        letter-spacing: -0.055em;
      }

      .description {
        max-width: 520px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .download {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 32px;
        padding: 0 22px;
        border: 1px solid var(--purple);
        border-radius: 6px;
        background: var(--purple);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
      }

      .download:hover,
      .download:focus-visible {
        background: #321731;
        box-shadow: 0 10px 24px rgba(68, 33, 66, 0.2);
        transform: translateY(-1px);
        outline: none;
      }

      .download:focus-visible {
        box-shadow: 0 0 0 4px rgba(180, 168, 125, 0.38);
      }

      .meta {
        margin: 14px 0 0;
        color: #8b858d;
        font-size: 12px;
      }

      @media (max-width: 520px) {
        .panel {
          padding: 30px 24px;
        }

        .download {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="accent" aria-hidden="true"></div>
    <main>
      <section class="panel" aria-labelledby="page-title">
        <p class="eyebrow">PowerPoint download</p>
        <h1 id="page-title">Data format</h1>
        <p class="description">
          Customer and site master data-format presentation, repaired and tested for PowerPoint compatibility.
        </p>
        <a class="download" href="./data-format.pptx" download="data-format.pptx">
          Download PowerPoint
        </a>
        <p class="meta">PowerPoint (.pptx) · 469 KB · Updated August 2026</p>
      </section>
    </main>
  </body>
</html>
